# 프로젝트 폴더명이 한글이라 compose가 프로젝트명을 자동 생성하지 못한다. 명시 고정.
name: travel-ops

services:
  api:
    build: .
    env_file: .env
    environment:
      # .env의 DATABASE_URL은 호스트 uvicorn용(@localhost)이다. 컨테이너 안에서는 서비스명으로 붙어야 하므로
      # 여기서 덮어쓴다 (compose 우선순위: environment > env_file). ${...}는 compose가 .env에서 보간한다.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    # PGVector 동봉 이미지 (ADR-0002: PostgreSQL 17)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 하이브리드 모드: 호스트에서 도는 uvicorn이 이 통로로 붙는다
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api가 DB보다 먼저 떠서 죽는 것을 막는다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
