# 프로젝트 폴더명이 한글이라 compose가 프로젝트명을 자동 생성하지 못한다. 명시 고정.
name: travel-ops

services:
  api:
    build: .
    env_file: .env
    environment:
      # .env의 DATABASE_URL은 호스트 uvicorn용(@localhost)이다. 컨테이너 안에서는 서비스명으로 붙어야 하므로
      # 여기서 덮어쓴다 (compose 우선순위: environment > env_file). ${...}는 compose가 .env에서 보간한다.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # 같은 이유로 REDIS_URL도 덮어쓴다. .env의 localhost는 호스트 uvicorn용이다
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    # 서버와 같은 프록시를 로컬에서도 태운다 — 버퍼링 설정을 여기서 재현·시연할 수 있다
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  postgres:
    # PGVector 동봉 이미지 (ADR-0002: PostgreSQL 17)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 하이브리드 모드: 호스트에서 도는 uvicorn이 이 통로로 붙는다
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # api가 DB보다 먼저 떠서 죽는 것을 막는다
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      # postgres와 같은 이유 — 하이브리드 모드의 호스트 uvicorn이 이 통로로 붙는다.
      # 이게 없으면 개발 중에는 캐시가 통째로 죽은 채로 돈다(장애 격리 덕에 조용히 는다)
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
