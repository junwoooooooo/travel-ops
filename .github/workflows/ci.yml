name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 로컬 docker-compose와 같은 이미지 (ADR-0002)
        image: pgvector/pgvector:pg17
        env:
          # 잡이 끝나면 사라지는 일회용 컨테이너의 값이다. 진짜 비밀은 .env / GitHub Secrets에만 둔다
          POSTGRES_USER: ci_dummy_user
          POSTGRES_PASSWORD: ci_dummy_password_not_a_secret
          POSTGRES_DB: travelops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_dummy_user -d travelops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # conftest가 이 URL에서 travelops_test를 파생시킨다
      DATABASE_URL: postgresql+asyncpg://ci_dummy_user:ci_dummy_password_not_a_secret@localhost:5432/travelops

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 로컬·Dockerfile과 같은 라인 (ADR-0001)
          python-version: "3.13"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트용 JWT_SECRET 생성
        # 비밀값은 커밋하지 않는다. 잡 실행 중에 만들어 그 잡에서만 쓴다
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: pytest
        run: pytest -q

  deploy:
    needs: test
    # PR에서는 돌지 않는다. main에 실제로 얹힌 커밋만 서버로 간다
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 연속 push로 배포가 겹치면 t3.micro(911MB)에서 compose build 두 개가 메모리를 나눠 쓴다.
    # 진행 중인 배포를 취소하지는 않는다 — 반쯤 재기동된 서버가 더 비싸다
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      # 비밀이 아니라 설정이다. Amazon Linux면 리포 변수 EC2_USER를 ec2-user로 두면 된다
      EC2_USER: ${{ vars.EC2_USER || 'ubuntu' }}

    steps:
      - name: secret 확인
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST"    || { echo "::error::EC2_HOST secret이 없다"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY secret이 없다"; exit 1; }

      - name: SSH 키 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 러너는 매번 새 VM이라 known_hosts가 비어 있다. 매 배포가 TOFU다 (ADR-0006)
          ssh-keyscan -T 10 "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 서버 갱신·재기동
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "GIT_SHA='$GIT_SHA' bash -euxs" <<'REMOTE'
          cd ~/travel-ops
          git fetch --prune origin
          # pull이 아니라 SHA 고정. "지금 서버에 뭐가 떠 있나"가 타이밍에 좌우되지 않는다.
          # .env는 추적 대상이 아니라 reset이 지우지 않는다
          git reset --hard "$GIT_SHA"
          docker compose -f docker-compose.prod.yml up -d --build
          # 빌드마다 쌓이는 dangling 이미지. 8GB 디스크에서는 방치하면 언젠가 터진다
          docker image prune -f
          REMOTE

      - name: 배포 검증
        # 이 단계가 없으면 "ssh가 끊기지 않았다"를 "배포 성공"으로 읽게 된다
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$EC2_HOST/health" || true)
            if [ "$code" = "200" ]; then
              echo "확인: /health 200 (${i}번째 시도, 약 $(( (i-1) * 3 ))초)"
              exit 0
            fi
            echo "기동 대기… HTTP $code"
            sleep 3
          done
          echo "::error::배포 후 60초 안에 /health가 200을 주지 않았다"
          exit 1
