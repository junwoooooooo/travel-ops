upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # LLM 응답은 수십 초가 걸린다 (R1). 기본 60초로는 게이트웨이가 먼저 끊는다
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 연결을 프록시가 닫지 않도록 비운다
        proxy_set_header Connection "";

        # ADR-8. 청크가 작으면 버퍼링을 켜도 통과하지만(로컬 3청크 테스트에선 차이 없었다),
        # 토큰 스트림처럼 양이 늘면 버퍼에 갇힌다. 이 규모에서 버퍼링 이득은 없으므로 끈다
        proxy_buffering off;
        proxy_cache off;
    }
}
