# Schema change tool config (see docs/adr/0007-alembic-migrations.md).
#
# ASCII only. Alembic reads this file with encoding="locale" (alembic/util/compat.py),
# so non-ASCII bytes crash on a Windows cp949 console. Korean notes live in
# migrations/README and migrations/env.py, which Python always reads as UTF-8.

[alembic]
script_location = %(here)s/migrations

# Date prefix keeps files in chronological order; revision ids are given by hand (--rev-id 0001).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# env.py imports the app package.
prepend_sys_path = .

path_separator = os

# No sqlalchemy.url here on purpose: the DB address comes from .env only (app/config.py).
# See get_url() in migrations/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
